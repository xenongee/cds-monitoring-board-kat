<!DOCTYPE html>
<html lang="ru" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDS.Vyatka - Мониторинг</title>

    <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="header-img">
                <img src="./assets/header.png" alt="CDS Vyatka Monitoring Logo">
            </div>
            <div class="container msg-container-bottom" id="msg">
                <p class="msg hide">Message</p>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="grid-row table" id="cds-table">

            </div>
            <template id="cds-table-col-template">
                <div class="container-fluid table-column" id="column">
                    <h1 class="column-header" id="column-header">Column Header</h1>
                    <div class="column-content" id="column-content">Column Content</div>
                </div>
            </template>
            <template id="cds-table-row-template">
                <div class="grid-row flow" id="row">
                    <div class="bus-info" id="content-bus">
                        <p class="bus-registration" id="gosnum">gosnum</p>
                        <h2 id="bus">Bus</h2>
                    </div>
                    <h2 id="content-time">Time</h2>
                </div>
            </template>
        </div>
    </main>
    <footer>
        <div class="ticker">
            <div class="ticker-track">
                <span class="ticker-item"> КОГПОБУ «Кировский авиационный техникум»    🚌 Чат-бот «Умная остановка» во ВКонтакте (vk.me/kirovbus)    🌐 Сайт ЦДС: m.cdsvyatka.com        🚌</span>
                <span class="ticker-item" aria-hidden="true"> КОГПОБУ «Кировский авиационный техникум»    🚌 Чат-бот «Умная остановка» во ВКонтакте (vk.me/kirovbus)    🌐 Сайт ЦДС: m.cdsvyatka.com        🚌</span>
            </div>
        </div>
    </footer>
</body>

<script src="assets/app.js"></script>

</html>
